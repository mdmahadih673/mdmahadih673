<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="100%" height="100%">
  <style>
    .bg { fill: #FFFFFF; }
    .title { font: bold 16px 'Courier New', monospace; fill: #0891B2; }
    .label { font: bold 14px 'Courier New', monospace; fill: #6D28D9; }
    .value { font: 14px 'Courier New', monospace; fill: #0F172A; }
    .subtext { font: 13px 'Courier New', monospace; fill: #475569; }
    .border { stroke: #E2E8F0; stroke-width: 2; fill: none; }
    .accent { fill: #059669; }
    .live-dot { fill: #EF4444; animation: blink 1.5s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  </style>

  <!-- Background -->
  <rect width="1180" height="610" rx="12" class="bg" />
  <rect x="2" y="2" width="1176" height="606" rx="10" class="border" />

